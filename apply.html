<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apply — Finura</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><img src="assets/logo.png" alt="Finura logo" class="logo" /></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="/">Home</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Apply for a Loan</h1>
    <p>Fill the form below and our advisor will contact you to proceed.</p>
    <form id="apply-form" class="apply-form" name="apply" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/" novalidate>
      <input type="hidden" name="form-name" value="apply" />
      <p class="hidden"><label>Don’t fill this out: <input name="bot-field-apply" /></label></p>

      <label>Full Name <input name="name" type="text" required/></label>
      <label>Email <input name="email" type="email" required/></label>
      <label>Phone <input name="phone" type="tel" required/></label>
      <label>Loan Type
        <select name="loan_type" required>
          <option value="">Select</option>
          <option>Home Loan</option>
          <option>Personal Loan</option>
          <option>Auto Loan</option>
          <option>Business Loan</option>
        </select>
      </label>
      <label>Amount (numeric) <input name="amount" type="number" min="0" required/></label>
      <label>Tenure (years) <input name="tenure" type="number" min="0" step="0.1" required/></label>
      <label>Message <textarea name="message" rows="4"></textarea></label>
      <button class="btn" type="submit">Submit Application</button>
    </form>

    <p class="muted">Note: The form posts to Netlify (if you deploy to Netlify) or to your chosen backend. To receive submissions via Netlify you just need to deploy the site to Netlify — forms will be captured automatically.</p>
  </main>

  <footer class="site-footer">
    <div class="container"><p>&copy; <span id="year'></span> Finura</p></div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
